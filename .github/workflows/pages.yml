# Build web/ and publish it to GitHub Pages.
#
# The site is built from committed artifacts only. model/export_web.py needs
# the derived arrays -- likelihood.npz, the grid, the scraped map GIFs -- which
# are gitignored because together they are about 210 MB, so regenerating them
# here would mean re-scraping the survey on every push. Instead the exporter
# runs locally and its output (web/public/data and web/src/content) is
# committed, which is why a research change reaches the site only after
# export_web.py is re-run and the result committed. check.py is what enforces
# that the committed output still matches the data, so it gates the deploy: a
# site whose numbers disagree with the CSVs behind them is the one failure this
# project most wants to avoid publishing, and a promise nothing runs is not a
# promise. check.py imports no model and needs only numpy, so the gate is cheap.

name: pages

on:
  push:
    branches: [main]
    paths:
      # Everything check.py reads, not just the site. A research change that
      # lands a new CSV without re-running export_web.py must fail here rather
      # than sit undetected until someone next touches web/.
      - "web/**"
      - "data/**"
      - "model/**"
      - "*.md"
      - "check.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install numpy

      - name: Check every published number still matches its source
        run: python check.py

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which is the major that wrote
          # package-lock.json. npm 10 and npm 11 hoist transitive dependencies
          # differently, so a lockfile written by one can be rejected as out of
          # sync by `npm ci` on the other.
          #
          # What actually made this fragile was a stale `vite` pin in
          # package.json left over from before the move to Astro. Astro 7 wants
          # vite 8 and the pin asked for vite 6, so the tree carried two vites
          # and two esbuilds, and npm placed the second copy differently on
          # macOS than on Linux. Nothing imported the pinned vite; removing it
          # left one of each. Astro's own scaffold sets no vite dependency.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the lockfile carries this runner's binaries
        working-directory: web
        run: npm run lint:lockfile

      - name: Install
        working-directory: web
        run: npm ci

      - name: Check the browser model still reproduces model/infer.py
        working-directory: web
        run: npm run verify

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
